[package]
name = "automix"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fully automatic DJ transition engine: rhythm/harmony/structure analysis, transition planning with a cost function, EQ automation, time stretching and a real-time mix engine."
license = "MIT OR Apache-2.0"

# No external crates: the engine is dependency-free (std only) so it can be
# embedded in desktop/mobile DJ applications without a heavy toolchain.

[lib]
name = "automix"
path = "src/lib.rs"

[[bin]]
name = "automix-demo"
path = "src/bin/demo.rs"

[profile.release]
opt-level = 3
lto = true
